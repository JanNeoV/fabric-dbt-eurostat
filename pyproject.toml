[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triathlon-semantic-contract-poc"
version = "0.1.0"
description = "Semantic contract POC comparing dbt semantic YAML, Power BI TMDL, and generated Snowflake Semantic View YAML."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
dbt = [
  "dbt-core>=1.10,<2.0",
  "dbt-fabric>=1.9,<2.0",
]
snowflake = [
  "snowflake-connector-python>=3.12,<4.0",
]

[tool.setuptools.packages.find]
include = ["semantic_poc*"]

[tool.pytest.ini_options]
testpaths = ["semantic_poc/tests"]
norecursedirs = ["dbt_packages", "target", "dbt_modules", "logs", ".venv", "venv", "build", "dist"]
addopts = "-p no:cacheprovider"
